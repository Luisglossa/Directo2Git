<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aprende Frontend | Tu aventura comienza</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #080d1b;
            color: white;
            overflow: hidden;
            min-height: 100vh;
        }

        /* PARALLAX BACKGROUND */

        .parallax-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
        }

        .parallax-layer {
            position: absolute;
            inset: -5%;
            will-change: transform;
            pointer-events: none;
        }

        .image-slide {
            position: absolute;
            inset: 0;

            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            opacity: 0;

            transition: opacity 1.5s ease-in-out;

            will-change: opacity;
        }

        .image-slide.active {
            opacity: 1;
        }

        .layer-1 {
            transform: scale(1.1);
        }

        .layer-2 {
            mix-blend-mode: screen;
        }

        .layer-3 {
            mix-blend-mode: lighten;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 1;

            background:
                linear-gradient(135deg,
                    rgba(5, 10, 30, 0.62),
                    rgba(20, 10, 50, 0.35),
                    rgba(5, 15, 35, 0.62));

            pointer-events: none;
        }

        /* MAIN CONTENT */

        .content {
            position: relative;
            z-index: 2;

            height: 100vh;
            min-height: 550px;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;

            text-align: center;
            padding: 30px;
        }
        

        .tag {
            color: #aab7ff;
            background: rgba(100, 120, 255, 0.16);
            border: 1px solid rgba(130, 150, 255, 0.45);

            padding: 10px 20px;
            border-radius: 30px;

            font-size: 13px;
            letter-spacing: 2px;

            margin-bottom: 25px;
            text-transform: uppercase;

            backdrop-filter: blur(10px);
        }
        .tag:hover{background: #8497f6;}

        h1 {
            font-size: clamp(2.5rem, 4vw, 5.5rem);
            font-weight: 800;
            line-height: 1.1;
            max-width: 950px;
            background: linear-gradient(130deg,
                    #ffffff,
                    #1613bb,
                    #de4242);
            background-clip:text;
            -webkit-background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
        }

        .subtitle {
            max-width: 650px;
            font-size: clamp(1rem, 2vw, 1.3rem);
            line-height: 1.7;
            color: #ffffff;
            margin-bottom: 45px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            gap: 20px;

            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            border: none;

            padding: 16px 35px;

            font-size: 16px;
            font-weight: 700;

            border-radius: 12px;
            cursor: pointer;

            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg,
                    #647bff,
                    #9c5cff);

            color: white;

            box-shadow: 0 8px 30px rgba(100, 110, 255, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);

            border: 1px solid rgba(255, 255, 255, 0.3);

            color: white;

            backdrop-filter: blur(10px);
        }

        button:hover {
            transform: translateY(-5px) scale(1.04);
        }

        .btn-primary:hover {
            box-shadow: 0 12px 40px rgba(120, 100, 255, 0.6);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.22);
        }

        /* FIREWORKS */

        #fireworks {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;
            z-index: 10;
        }

        /* RESPONSIVE */

        @media (max-width: 600px) {

            .content {
                padding: 20px;
            }

            .buttons {
                flex-direction: column;

                width: 100%;
                max-width: 280px;
            }

            button {
                width: 100%;
            }

        }

        @media (prefers-reduced-motion: reduce) {

            .image-slide {
                transition: none;
            }

            button {
                transition: none;
            }

        }
    </style>

</head>

<body>

    <!-- PARALLAX BACKGROUND -->

    <div class="parallax-container">

        <div class="parallax-layer layer-1">
            <div class="image-slide"></div>
            <div class="image-slide"></div>
        </div>

        <div class="parallax-layer layer-2">
            <div class="image-slide"></div>
            <div class="image-slide"></div>
        </div>

        <div class="parallax-layer layer-3">
            <div class="image-slide"></div>
            <div class="image-slide"></div>
        </div>

        <div class="overlay"></div>

    </div>


    <!-- MAIN CONTENT -->

    <main class="content">

        <div class="tag">
            🚀 Tu futuro comienza aquí
        </div>

        <h1>
            El mundo del Frontend está en tus manos
        </h1>

        <p class="subtitle">
            Aprende, experimenta y transforma tus ideas en experiencias
            digitales increíbles. Cada línea de código es un paso más
            hacia tu próxima gran creación.
        </p>

        <div class="buttons">

            <button class="btn-primary" id="changeImages">
                Dame click
            </button>

            <button class="btn-secondary" id="surprise">
                🎆 Sorpresa
            </button>

        </div>

    </main>


    <!-- FIREWORKS CANVAS -->

    <canvas id="fireworks"></canvas>


    <script>
        const images = [

            'https://images.unsplash.com/photo-1518770660439-4636190af475?w=1920',

            'https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1920',

            'https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=1920'

        ];


        // Get parallax layers

        const layers = [

            document.querySelector('.layer-1'),
            document.querySelector('.layer-2'),
            document.querySelector('.layer-3')

        ];


        // Get the two slides inside each layer

        const slides = layers.map(layer => [

            layer.children[0],
            layer.children[1]

        ]);


        // Image and slide tracking

        let currentImage = 0;

        let currentSlide = 0;

        let isTransitioning = false;

        const transitionDuration = 1500;


        /* INITIALIZE IMAGES */

        layers.forEach((layer, index) => {

            // Set initial image on first slide

            slides[index][0].style.backgroundImage =
                `url("${images[currentImage]}")`;

            // Set second slide

            slides[index][1].style.backgroundImage =
                `url("${images[currentImage]}")`;

            // Activate first slide

            slides[index][0].classList.add('active');

        });


        /* CHANGE IMAGES */

        function changeImages() {

            // Prevent clicks during transition

            if (isTransitioning) return;

            isTransitioning = true;


            // Calculate next image

            const nextImage =
                (currentImage + 1) % images.length;


            // Switch between the two slides

            const nextSlide = 1 - currentSlide;


            // Update all parallax layers

            layers.forEach((layer, index) => {

                const outgoing =
                    slides[index][currentSlide];

                const incoming =
                    slides[index][nextSlide];


                // Set next image

                incoming.style.backgroundImage =
                    `url("${images[nextImage]}")`;


                // Activate incoming image

                incoming.classList.add('active');


                // Deactivate previous image

                outgoing.classList.remove('active');

            });


            // Update image tracking

            currentImage = nextImage;

            currentSlide = nextSlide;


            // Wait until transition finishes

            setTimeout(() => {


                // Synchronize inactive slides

                layers.forEach((layer, index) => {

                    const inactive =
                        slides[index][1 - currentSlide];

                    inactive.style.backgroundImage =
                        `url("${images[currentImage]}")`;

                });


                // Allow next click

                isTransitioning = false;


            }, transitionDuration);

        }


        // Button event

        document.getElementById('changeImages')
            .addEventListener('click', changeImages);


        let mouseX = 0;
        let mouseY = 0;

        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
            layers.forEach((layer, index) => {
                const intensity = (index + 1) * 4;
                layer.style.transform = `
                    translate(
                        ${mouseX * intensity}px,
                        ${mouseY * intensity}px
                    )

                    scale(1.1)

                `;

            });

        });


        const canvas =
            document.getElementById('fireworks');

        const ctx =
            canvas.getContext('2d');


        let particles = [];

        let animationId = null;

        let fireworksActive = false;

        let fireworksTimeout = null;


        /* RESIZE CANVAS */

        function resizeCanvas() {

            const dpr = Math.min(
                window.devicePixelRatio || 1,
                2
            );


            canvas.width =
                window.innerWidth * dpr;

            canvas.height =
                window.innerHeight * dpr;


            canvas.style.width =
                window.innerWidth + 'px';

            canvas.style.height =
                window.innerHeight + 'px';


            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );

        }


        resizeCanvas();

        window.addEventListener('resize', resizeCanvas);



        /* PARTICLE CLASS */

        class Particle {

            constructor(x, y, color) {

                this.x = x;

                this.y = y;


                const angle =
                    Math.random() * Math.PI * 2;

                const speed =
                    Math.random() * 6 + 2;


                this.vx =
                    Math.cos(angle) * speed;

                this.vy =
                    Math.sin(angle) * speed;


                this.alpha = 1;

                this.decay =
                    Math.random() * 0.015 + 0.008;


                this.color = color;

                this.size =
                    Math.random() * 3 + 1;

            }


            update() {

                this.x += this.vx;

                this.y += this.vy;


                this.vx *= 0.98;

                this.vy *= 0.98;

                this.vy += 0.04;


                this.alpha -= this.decay;

            }


            draw() {

                ctx.globalAlpha =
                    Math.max(this.alpha, 0);

                ctx.fillStyle = this.color;


                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();


                ctx.globalAlpha = 1;

            }

        }



        /* CREATE FIREWORK */

        function createFirework() {

            const x =
                Math.random() * window.innerWidth;

            const y =
                Math.random() * window.innerHeight * 0.75;


            const colors = [

                '#ff3cac',
                '#784bff',
                '#00e5ff',
                '#ffe066',
                '#ff7043',
                '#ffffff'

            ];


            const color = colors[

                Math.floor(
                    Math.random() * colors.length
                )

            ];


            const particleCount = 80;


            for (let i = 0; i < particleCount; i++) {

                particles.push(
                    new Particle(x, y, color)
                );

            }

        }



        /* ANIMATE FIREWORKS */

        function animateFireworks() {


            ctx.clearRect(
                0,
                0,
                window.innerWidth,
                window.innerHeight
            );


            particles.forEach(particle => {

                particle.update();

                particle.draw();

            });


            particles = particles.filter(
                particle => particle.alpha > 0
            );


            if (fireworksActive) {

                if (Math.random() < 0.07) {

                    createFirework();

                }

            }


            if (
                fireworksActive ||
                particles.length > 0
            ) {

                animationId =
                    requestAnimationFrame(
                        animateFireworks
                    );

            } else {

                ctx.clearRect(
                    0,
                    0,
                    window.innerWidth,
                    window.innerHeight
                );

                animationId = null;

            }

        }



        /* SURPRISE BUTTON */

        document.getElementById('surprise')
            .addEventListener('click', () => {


                fireworksActive = true;


                // Restart duration if clicked again

                clearTimeout(fireworksTimeout);


                // Start animation if not running

                if (!animationId) {

                    animateFireworks();

                }


                // Stop creating fireworks after 8 seconds

                fireworksTimeout = setTimeout(() => {

                    fireworksActive = false;

                }, 8000);

            });


    </script>

</body>

</html>
